[env:waveshare_esp32s3_lcd13]
; To build the original Phase 6 LCD interface, change HP35_USE_LVGL=1 to 0.
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=0
    -D HP35_USE_LVGL=1
    -D LV_CONF_SKIP
    -D LV_COLOR_DEPTH=16
    -D LV_USE_LOG=0
    -D LV_FONT_MONTSERRAT_20=1
    -D LV_FONT_MONTSERRAT_16=1
    -D LV_FONT_MONTSERRAT_12=1
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.5.0
    lvgl/lvgl @ 9.3.0
